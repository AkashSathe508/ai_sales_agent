# ============================================================
# LiteLLM Proxy Configuration
# ============================================================
# This config is used when running the LiteLLM proxy server.
# The application also uses LiteLLM as a library directly
# through app/llm/service.py without requiring this proxy.
#
# To run the proxy:
#   litellm --config infrastructure/litellm/config.yaml --port 4000
# ============================================================

model_list:
  # Primary model — Gemini 2.5 Flash (1M context, JSON mode, tool calling)
  - model_name: "sales-agent-primary"
    litellm_params:
      model: "gemini/gemini-2.5-flash"
      api_key: "os.environ/GOOGLE_API_KEY"
      timeout: 60
      max_retries: 3

  # Gemini fallback — Gemini 2.0 Flash (lighter, stable)
  - model_name: "sales-agent-gemini-fallback"
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: "os.environ/GOOGLE_API_KEY"
      timeout: 30
      max_retries: 2

  # Provider fallback — Groq GPT-OSS 120B (JSON mode, tool calling)
  - model_name: "sales-agent-groq"
    litellm_params:
      model: "groq/openai/gpt-oss-120b"
      api_key: "os.environ/GROQ_API_KEY"
      timeout: 30
      max_retries: 2

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  retry_after: 5
  allowed_fails: 2
  cooldown_time: 60

  # Bounded fallback: Gemini primary → Gemini fallback → Groq
  # No cycle — fallback depth is exactly 2 hops.
  fallbacks:
    - {"sales-agent-primary": ["sales-agent-gemini-fallback", "sales-agent-groq"]}
    - {"sales-agent-gemini-fallback": ["sales-agent-groq"]}

litellm_settings:
  success_callback: []
  failure_callback: []
  cache: false
  request_timeout: 60
  drop_params: false
  set_verbose: false

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL_SYNC"
  store_model_in_db: false
  allow_requests_on_db_unavailable: true